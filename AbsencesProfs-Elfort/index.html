/* ─── UTILITAIRES ─── */
function r1(v) { return Math.round((v || 0) * 10) / 10; }
function fmtH(v) { return r1(v).toLocaleString('fr-FR'); }
function fmtPct(v) {
  return (Math.round((v || 0) * 1000) / 10).toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %';
}
function remplColor(t) {
  if (t >= 0.4) return '#2e7d32';
  if (t >= 0.2) return '#f57c00';
  return '#c62828';
}
function catTotals(d) {
  var tot = { admin: 0, accomp: 0, personnel: 0 };
  d.motifs.forEach(function (m) { tot[m.categorie] += m.nonAssures; });
  return tot;
}
function detectAnnee(name) {
  var m = name.match(/(\d{2})\D+(\d{2})\s*$/);
  return m ? ('20' + m[1] + '-20' + m[2]) : null;
}

/* ─── PARSEUR EXCEL ─── */
function parseExcel(buf) {
  var wb = XLSX.read(buf, { type: 'array', cellDates: false });
  var annees = {};
  wb.SheetNames.forEach(function (name) {
    var annee = detectAnnee(name);
    if (!annee) return;
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null });
    if (rows.length < 3) return;
    var tr = rows[1];
    var total = {
      coursPrevus: Number(tr[1]) || 0,
      nonAssures: Number(tr[2]) || 0,
      tauxGlobal: Number(tr[3]) || 0,
      remplaces: Number(tr[4]) || 0,
      tauxRemplGlobal: Number(tr[5]) || 0,
      heuresAdmin: Number(tr[6]) || 0,
      heuresAccomp: Number(tr[7]) || 0,
      tauxPerso: Number(tr[8]) || 0
    };
    var motifs = [];
    for (var i = 2; i < rows.length; i++) {
      var r = rows[i];
      if (!r[0]) continue;
      var admin = Number(r[6]) || 0;
      var accomp = Number(r[7]) || 0;
      motifs.push({
        motif: String(r[0]).trim(),
        nonAssures: Number(r[2]) || 0,
        tauxPct: Number(r[3]) || 0,
        remplaces: Number(r[4]) || 0,
        tauxRempl: Number(r[5]) || 0,
        heuresAdmin: admin,
        heuresAccomp: accomp,
        tauxPerso: Number(r[8]) || 0,
        categorie: admin > 0 ? 'admin' : (accomp > 0 ? 'accomp' : 'personnel')
      });
    }
    annees[annee] = { annee: annee, total: total, motifs: motifs };
  });
  return annees;
}

/* ─── SAUVEGARDE GITHUB (partagée avec le Hub) ─── */
var GH_USER = 'christophebignon5-crypto', GH_REPO = 'elfort-pilotage', GH_PAT_KEY = '_hub_elfort_pat';
function ghToB64(str) { return btoa(unescape(encodeURIComponent(str))); }
function saveToGithub(payload, ghPath, label) {
  var token = localStorage.getItem(GH_PAT_KEY) || '';
  if (!token) {
    token = prompt('Token d\'accès GitHub (Personal Access Token classique, droit "repo") :\n\nCréez-le sur github.com/settings/tokens/new\nIl sera mémorisé sur cet appareil et partagé avec le Hub et les autres applications.');
    if (!token) return Promise.reject(new Error('Token requis'));
    token = token.trim();
    if (!token) return Promise.reject(new Error('Token requis'));
    localStorage.setItem(GH_PAT_KEY, token);
  }
  var content = ghToB64(JSON.stringify({ version: '1.0', date: new Date().toISOString(), app: label, data: payload }, null, 2));
  var url = 'https://api.github.com/repos/' + GH_USER + '/' + GH_REPO + '/contents/' + ghPath;
  var headers = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' };
  return fetch(url + '?ref=main', { headers: headers })
    .then(function (r) { return r.status === 200 ? r.json() : null; })
    .then(function (existing) {
      var body = { message: 'Sauvegarde ' + label + ' - ' + new Date().toLocaleString('fr-FR'), content: content, branch: 'main' };
      if (existing && existing.sha) body.sha = existing.sha;
      return fetch(url, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, headers), body: JSON.stringify(body) });
    })
    .then(function (r) {
      if (!r.ok) return r.json().then(function (e) { throw new Error((e.message || r.statusText) + (e.errors ? (' :: ' + e.errors.map(function (x) { return x.message || JSON.stringify(x); }).join(' | ')) : '')); });
      return r.json();
    });
}

/* ─── REDUCER ─── */
var INIT = { annees: {}, active: null, tab: 'synthese' };
function reducer(st, a) {
  if (a.type === 'ADD_MULTI') {
    var annees = Object.assign({}, st.annees, a.d);
    var keys = Object.keys(annees).sort();
    var active = keys[keys.length - 1];
    saveSt({ annees: annees, active: active });
    return Object.assign({}, st, { annees: annees, active: active });
  }
  if (a.type === 'SET_ACTIVE') {
    saveSt({ annees: st.annees, active: a.v });
    return Object.assign({}, st, { active: a.v });
  }
  if (a.type === 'SET_TAB') {
    return Object.assign({}, st, { tab: a.v });
  }
  if (a.type === 'LOAD') {
    var an = a.d.annees || {};
    var keys2 = Object.keys(an).sort();
    var act = a.d.active || keys2[keys2.length - 1] || null;
    saveSt({ annees: an, active: act });
    return Object.assign({}, st, { annees: an, active: act });
  }
  if (a.type === 'DEL') {
    var anns = Object.assign({}, st.annees);
    delete anns[a.v];
    var k3 = Object.keys(anns).sort();
    var newAct = st.active === a.v ? (k3[k3.length - 1] || null) : st.active;
    saveSt({ annees: anns, active: newAct });
    return Object.assign({}, st, { annees: anns, active: newAct });
  }
  return st;
}

/* Carte graphique avec bouton "Copier" */
function ChartCard(props) {
  var copyState = useState(false);
  var copying = copyState[0]; var setCopying = copyState[1];
  var copiedState = useState(false);
  var copied = copiedState[0]; var setCopied = copiedState[1];
  var cardRef = useRef(null);

  function doCopy() {
    if (!cardRef.current || !window.html2canvas) return;
    setCopying(true);
    window.html2canvas(cardRef.current, { scale: 2, backgroundColor: '#ffffff', useCORS: true })
      .then(function (canvas) {
        function dl() {
          var a = document.createElement('a');
          a.href = canvas.toDataURL('image/png');
          a.download = 'graphique.png';
          a.click();
          setCopying(false);
        }
        if (navigator.clipboard && window.ClipboardItem) {
          canvas.toBlob(function (blob) {
            navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
              .then(function () { setCopying(false); setCopied(true); setTimeout(function () { setCopied(false); }, 1800); })
              .catch(dl);
          });
        } else { dl(); }
      })
      .catch(function () { setCopying(false); });
  }

  return (
    <div className="card" ref={cardRef}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
        <div className="card-title" style={{ margin: 0 }}>{props.title}</div>
        <button
          onClick={doCopy}
          disabled={copying}
          title="Copier ce graphique comme image"
          style={{ background: copied ? '#2e7d32' : '#f5f5f5', border: '1px solid #ddd', borderRadius: 5, padding: '3px 11px', fontSize: '.75rem', cursor: copying ? 'default' : 'pointer', color: copied ? 'white' : '#555', flexShrink: 0, whiteSpace: 'nowrap' }}
        >
          {copied ? '✓ Copié' : copying ? '...' : '📋 Copier'}
        </button>
      </div>
      {props.children}
    </div>
  );
}

/* ══ MOTIFS ══ */

    nonAssures: function (a, b) { return b.nonAssures - a.nonAssures; },

          </thead>
          <tbody>
            {motifs.map(function (m, i) {

                  <td>{m.motif}</td>

/* ══ APP ══ */
function App() {
  var saved = loadSt();
  var initState = Object.assign({}, INIT);
  if (saved && saved.annees && Object.keys(saved.annees).length) {
    var keys = Object.keys(saved.annees).sort();
    initState.annees = saved.annees;
    initState.active = saved.active || keys[keys.length - 1];
  } else {
    var keys2 = Object.keys(INITIAL_DATA).sort();
    initState.annees = INITIAL_DATA;
    initState.active = keys2[keys2.length - 1];
  }

  var stateResult = useReducer(reducer, initState);
  var st = stateResult[0];
  var dispatch = stateResult[1];

  var toastResult = useState(null);
  var toast = toastResult[0];
  var setToast = toastResult[1];

  var importingResult = useState(false);
  var importing = importingResult[0];
  var setImporting = importingResult[1];

  var filtreResult = useState('tous');
  var motifFiltre = filtreResult[0];
  var setMotifFiltre = filtreResult[1];

  var triResult = useState('nonAssures');
  var motifTri = triResult[0];
  var setMotifTri = triResult[1];

  var years = Object.keys(st.annees).sort();
  var data = st.active && st.annees[st.active] ? st.annees[st.active] : null;

  function notify(msg, type) {
    setToast({ msg: msg, type: type || 'info' });
    setTimeout(function () { setToast(null); }, 3200);
  }

  function importExcel() {
    var inp = document.getElementById('file-input');
    inp.accept = '.xlsx';
    inp.value = '';
    inp.onchange = function (e) {
      var f = e.target.files[0];
      if (!f) return;
      setImporting(true);
      var reader = new FileReader();
      reader.onload = function (ev) {
        try {
          var buf = new Uint8Array(ev.target.result);
          var d = parseExcel(buf);
          var n = Object.keys(d).length;
          if (n === 0) {
            notify('Aucun onglet "absences professeurs AA BB" trouvé dans ce fichier', 'error');
          } else {
            dispatch({ type: 'ADD_MULTI', d: d });
            notify(n + ' année(s) importée(s) : ' + Object.keys(d).sort().join(', '), 'success');
          }
        } catch (err) {
          notify('Erreur import : ' + err.message, 'error');
          console.error(err);
        }
        setImporting(false);
      };
      reader.readAsArrayBuffer(f);
    };
    inp.click();
  }

  function loadJSON() {
    var inp = document.getElementById('file-input');
    inp.accept = '.json';
    inp.value = '';
    inp.onchange = function (e) {
      var f = e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        try {
          var d = JSON.parse(ev.target.result);
          if (d && d.annees) {
            dispatch({ type: 'LOAD', d: d });
            notify(Object.keys(d.annees).length + ' année(s) chargée(s)', 'success');
          } else {
            notify('Fichier JSON invalide', 'error');
          }
        } catch (err) {
          notify('Erreur lors du chargement', 'error');
        }
      };
      reader.readAsText(f);
    };
    inp.click();
  }

  function saveJSON() {
    try {
      var blob = new Blob(
        [JSON.stringify({ annees: st.annees, active: st.active }, null, 2)],
        { type: 'application/json' }
      );
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var today = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = 'absences-profs-elfort-' + today + '.json';
      a.click();
      URL.revokeObjectURL(url);
      notify('Sauvegarde téléchargée', 'success');
    } catch (err) {
      notify('Erreur sauvegarde : ' + err.message, 'error');
    }
  }

  function saveToGithubAction() {
    notify('Envoi vers GitHub...', 'info');
    saveToGithub({ annees: st.annees, active: st.active }, 'saves/absences-profs.json', 'Indicateurs Absences Professeurs')
      .then(function () { notify('Sauvegarde envoyée sur GitHub', 'success'); })
      .catch(function (err) { notify('Erreur GitHub : ' + err.message, 'error'); });
  }

  /* ── EXPORT PPTX ANNÉE ── */
  function exportPPTXAnnee() {
    if (!data) return;
    if (!window.PptxGenJS) { notify('PptxGenJS non chargé (connexion requise)', 'error'); return; }
    notify('Génération du PPTX...', 'info');
    var pres = new PptxGenJS();
    pres.layout = 'LAYOUT_16x9';
    var DBL = '1A237E', BL = '1565C0', GR = '2E7D32', OR = 'F57C00', RD = 'C62828';
    var t = data.total;
    var cats = catTotals(data);

    var s1 = pres.addSlide();

    s1.addText('Indicateurs Absences Professeurs', { x: 0.5, y: 1.3, w: 9, h: 1.1, fontSize: 32, bold: true, color: 'FFFFFF', align: 'center' });
    s1.addText('LPO Léopold Elfort — Mana, Guyane', { x: 0.5, y: 2.55, w: 9, h: 0.55, fontSize: 18, color: 'BBDEFB', align: 'center' });
    s1.addText('Année scolaire ' + data.annee, { x: 0.5, y: 3.3, w: 9, h: 0.8, fontSize: 26, bold: true, color: 'FFF9C4', align: 'center' });
    s1.addText('Taux non assuré ' + fmtPct(t.tauxGlobal) + '  |  Taux remplacement ' + fmtPct(t.tauxRemplGlobal), { x: 0.5, y: 4.5, w: 9, h: 0.45, fontSize: 13, color: 'E3F2FD', align: 'center' });

    var s2 = pres.addSlide();
    s2.addText('Répartition des heures non assurées par catégorie — ' + data.annee, { x: 0.3, y: 0.15, w: 9.4, h: 0.6, fontSize: 20, bold: true, color: DBL });
    s2.addChart(pres.ChartType.pie, [{
      name: 'Heures',
      labels: ['Administratif', 'Accompagnement', 'Personnel'],
      values: [r1(cats.admin), r1(cats.accomp), r1(cats.personnel)]
    }], { x: 1.7, y: 0.9, w: 6.6, h: 5.2, chartColors: [BL, OR, RD], showLegend: true, legendPos: 'b' });

    var top = data.motifs.slice().sort(function (a, b) { return b.nonAssures - a.nonAssures; }).slice(0, 10);

    s3.addChart(pres.ChartType.bar, [{ name: 'Heures non assurées', labels: top.map(function (m) { return m.motif; }), values: top.map(function (m) { return r1(m.nonAssures); }) }], { x: 0.3, y: 0.9, w: 9.4, h: 5.3, barDir: 'bar', chartColors: [OR], showLegend: false });

    s4.addText('Taux de remplacement par motif (top 10) — ' + data.annee, { x: 0.3, y: 0.15, w: 9.4, h: 0.6, fontSize: 20, bold: true, color: DBL });

    pres.writeFile({ fileName: 'absences-profs-' + data.annee + '.pptx' })
      .then(function () { notify('PPTX ' + data.annee + ' téléchargé !', 'success'); })
      .catch(function (e) { notify('Erreur PPTX : ' + (e.message || e), 'error'); });
  }

  /* ── EXPORT PPTX COMPARATIF ── */
  function exportPPTXComparatif() {

    if (!window.PptxGenJS) { notify('PptxGenJS non chargé (connexion requise)', 'error'); return; }
    notify('Génération du PPTX comparatif...', 'info');
    var pres = new PptxGenJS();
    pres.layout = 'LAYOUT_16x9';
    var DBL = '1A237E', BL = '1565C0', GR = '2E7D32', RD = 'C62828';
    var colorMap = ['1565C0', 'E91E63', '2E7D32', 'E65100', '7B1FA2', '00695C'];

    var sc = pres.addSlide();
    sc.background = { color: DBL };
    sc.addText('Tableau Comparatif — Absences Professeurs', { x: 0.5, y: 1.3, w: 9, h: 1.1, fontSize: 32, bold: true, color: 'FFFFFF', align: 'center' });
    sc.addText('LPO Léopold Elfort — Mana, Guyane', { x: 0.5, y: 2.55, w: 9, h: 0.55, fontSize: 18, color: 'BBDEFB', align: 'center' });
    sc.addText(years.join(' — '), { x: 0.5, y: 3.3, w: 9, h: 0.8, fontSize: 26, bold: true, color: 'FFF9C4', align: 'center' });

    var sk = pres.addSlide();
    sk.addText('Indicateurs clés comparés', { x: 0.3, y: 0.15, w: 9.4, h: 0.6, fontSize: 20, bold: true, color: DBL });
    var hOpts = { bold: true, fill: { color: '1565C0' }, color: 'FFFFFF', fontSize: 12, align: 'center' };
    var tableRows = [[
      { text: 'Année', options: hOpts }, { text: 'Heures non assurées', options: hOpts },
      { text: 'Taux global', options: hOpts }, { text: 'Taux remplacement', options: hOpts }, { text: 'Taux pers.', options: hOpts }
    ]];
    years.forEach(function (y, i) {
      var t = st.annees[y].total;
      var fOpts = { fontSize: 12, align: 'center', fill: { color: i % 2 === 0 ? 'F5F5F5' : 'FFFFFF' } };
      tableRows.push([
        { text: y, options: Object.assign({}, fOpts, { bold: true }) },
        { text: fmtH(t.nonAssures), options: fOpts },
        { text: fmtPct(t.tauxGlobal), options: fOpts },
        { text: fmtPct(t.tauxRemplGlobal), options: fOpts },
        { text: fmtPct(t.tauxPerso), options: fOpts }
      ]);
    });
    sk.addTable(tableRows, { x: 0.7, y: 1.2, w: 8.6, colW: [1.6, 2.4, 1.6, 1.6, 1.4], rowH: 0.55, border: { type: 'solid', pt: 0.5, color: 'CCCCCC' } });

    var se = pres.addSlide();
    se.addText('Évolution des taux globaux (%)', { x: 0.3, y: 0.15, w: 9.4, h: 0.6, fontSize: 20, bold: true, color: DBL });
    se.addChart(pres.ChartType.line, [
      { name: "Taux d'absence", labels: years, values: years.map(function (y) { return r1(st.annees[y].total.tauxGlobal * 100); }) },
      { name: 'Taux de remplacement', labels: years, values: years.map(function (y) { return r1(st.annees[y].total.tauxRemplGlobal * 100); }) },
      { name: 'Taux raisons perso.', labels: years, values: years.map(function (y) { return r1(st.annees[y].total.tauxPerso * 100); }) }
    ], { x: 0.3, y: 0.9, w: 9.4, h: 5.3, chartColors: [BL, GR, RD], showLegend: true, legendPos: 'b', valAxisLabelFormatCode: '0"%"' });

    var sca = pres.addSlide();
    sca.addText('Répartition par catégorie et par année', { x: 0.3, y: 0.15, w: 9.4, h: 0.6, fontSize: 20, bold: true, color: DBL });
    sca.addChart(pres.ChartType.bar, [
      { name: 'Administratif', labels: years, values: years.map(function (y) { return r1(catTotals(st.annees[y]).admin); }) },
      { name: 'Accompagnement', labels: years, values: years.map(function (y) { return r1(catTotals(st.annees[y]).accomp); }) },
      { name: 'Personnel', labels: years, values: years.map(function (y) { return r1(catTotals(st.annees[y]).personnel); }) }
    ], { x: 0.3, y: 0.9, w: 9.4, h: 5.3, barDir: 'col', barGrouping: 'stacked', chartColors: colorMap, showLegend: true, legendPos: 'b' });

    pres.writeFile({ fileName: 'absences-profs-comparatif-' + years.join('-') + '.pptx' })
      .then(function () { notify('PPTX comparatif téléchargé !', 'success'); })
      .catch(function (e) { notify('Erreur PPTX : ' + (e.message || e), 'error'); });
  }

  var TABS = [
    { id: 'synthese',     lbl: 'Synthèse' },
    { id: 'motifs',       lbl: "Motifs d'absence" },
    { id: 'remplacement', lbl: 'Remplacement' },
    { id: 'comparaison',  lbl: 'Comparaison' },
    { id: 'guide',        lbl: 'Guide' }
  ];

  return (
    <div>
      {/* EN-TETE */}
      <div className="header">
        <div className="header-left">
          <div className="logo">🧑‍🏫</div>
          <div>
            <h1>Indicateurs Absences Professeurs</h1>
            <p>LPO Léopold Elfort — Mana, Guyane</p>
          </div>
        </div>
        <div style={{ textAlign: 'right' }}>
          {st.active
            ? <span className="annee-badge">Année {st.active}</span>
            : <span style={{ fontSize: '.82rem', opacity: .8 }}>Importez un fichier Excel pour commencer</span>}
        </div>
      </div>

      {/* BARRE D'OUTILS */}
      <div className="toolbar">
        <button className="btn btn-primary" onClick={importExcel} disabled={importing}>
          {importing ? 'Importation...' : 'Importer Excel'}
        </button>
        <button className="btn btn-outline" onClick={loadJSON}>Charger</button>
        {years.length > 0 && (
          <button className="btn btn-success" onClick={saveJSON}>Sauvegarder</button>
        )}
        {years.length > 0 && (
          <button className="btn" style={{ background: '#24292e', color: 'white' }} onClick={saveToGithubAction}>☁️ Sauvegarder sur GitHub</button>
        )}
        {data && (
          <button className="btn btn-outline" style={{ borderColor: '#7b1fa2', color: '#7b1fa2' }} onClick={exportPPTXAnnee} title={'Exporter un PPTX pour ' + st.active}>
            ▶ PPTX {st.active}
          </button>
        )}
        {years.length >= 2 && (
          <button className="btn btn-outline" style={{ borderColor: '#e65100', color: '#e65100' }} onClick={exportPPTXComparatif} title="Exporter un PPTX comparatif toutes années">
            ▶ PPTX Comparatif
          </button>
        )}
        {years.length > 0 && <span className="sep">|</span>}
        {years.length > 0 && <span style={{ fontSize: '.82rem', color: '#546e7a', fontWeight: 600 }}>Années :</span>}
        {years.map(function (y) {
          return (
            <span key={y} style={{ display: 'inline-flex', alignItems: 'center', gap: 3 }}>
              <button
                className={'btn btn-sm ' + (st.active === y ? 'btn-primary' : 'btn-outline')}
                onClick={function () { dispatch({ type: 'SET_ACTIVE', v: y }); }}>
                {y}
              </button>
              <button
                style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#c62828', fontSize: '1rem', padding: '0 3px', lineHeight: 1 }}
                title={'Supprimer ' + y}
                onClick={function () {
                  if (window.confirm("Supprimer l'année " + y + " du tableau de bord ?")) {
                    dispatch({ type: 'DEL', v: y });
                  }
                }}>
                x
              </button>
            </span>
          );
        })}
      </div>

      {/* ONGLETS */}
      <div className="tabs">
        {TABS.map(function (t) {
          return (
            <div key={t.id}
              className={'tab ' + (st.tab === t.id ? 'active' : '')}
              onClick={function () { dispatch({ type: 'SET_TAB', v: t.id }); }}>
              {t.lbl}
            </div>
          );
        })}
      </div>

      {/* TOAST */}
      {toast && (
        <div className="toast" style={{
          background: toast.type === 'error' ? '#c62828' : toast.type === 'success' ? '#2e7d32' : '#1565c0'
        }}>
          {toast.msg}
        </div>
      )}

      {/* CONTENU */}
      <div className="content">
        {st.tab === 'synthese'     && <TabSynthese d={data} />}
        {st.tab === 'motifs'       && <TabMotifs d={data} filtre={motifFiltre} onFiltre={setMotifFiltre} tri={motifTri} onTri={setMotifTri} />}
        {st.tab === 'remplacement' && <TabRemplacement d={data} />}
        {st.tab === 'comparaison'  && <TabComparaison annees={st.annees} />}
        {st.tab === 'guide'        && <TabGuide />}
      </div>
    </div>
  );
}

/* ══ ERROR BOUNDARY ══ */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error: error };
  }
  componentDidCatch(error, info) {
    console.error('React error:', error, info);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="err-box" style={{ margin: 20 }}>
          {'Erreur de rendu React :\n' + (this.state.error ? this.state.error.message : 'Erreur inconnue')}
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(ErrorBoundary, null, React.createElement(App, null))
);
</script>
</body>
</html>
